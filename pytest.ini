[pytest]
# Adiciona a raiz do projeto ao sys.path para que os módulos bot, src,
# main e config sejam encontrados independentemente de onde o pytest roda
# (localmente ou no runner do GitHub Actions).
pythonpath = .
testpaths = tests
addopts = --strict-markers
markers =
    unit: testes rapidos e isolados, sem arquivo, rede ou browser
    integration: testes da colaboracao entre modulos e arquivos temporarios
    regression: testes que protegem regras ou bugs ja corrigidos contra regressao
    e2e: testes do fluxo completo com fronteiras externas controladas
    browser: testes opcionais com Chromium e frontend em execucao
    slow: testes de execucao mais demorada
