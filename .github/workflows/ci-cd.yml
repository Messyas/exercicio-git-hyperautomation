name: CI/CD - Pipeline de Lotes

on:
  push:
    branches: [main, develop, Developer, "feature/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop, Developer]

env:
  PYTHON_VERSION: "3.12"

jobs:
  qualidade:
    name: Lint e qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install flake8
      - name: Verificar erros Python
        run: >-
          flake8 bot.py coletor.py main.py pipeline.py producer.py consumer.py config.py
          src/ api_ml/ tests/ web/ --count --select=E9,F63,F7,F82
          --show-source --statistics
      - name: Verificar estilo sem bloquear
        run: >-
          flake8 bot.py coletor.py main.py pipeline.py producer.py consumer.py config.py
          src/ api_ml/ tests/ web/ --count --max-line-length=120
          --ignore=E501,W503 --exit-zero --statistics

  test:
    name: Testes Python
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
        run: pip install -r requirements-dev.txt -r api_ml/requirements.txt
      - name: Executar suite local e validar cobertura
        shell: bash
        env:
          MAESTRO_ENABLED: "false"
        run: |
          mkdir -p reports/coverage-html data/output
          set -o pipefail
          pytest tests/ -m "not browser" -v --tb=short -rsxX \
            --cov=src --cov-config=.coveragerc \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/coverage-html \
            --cov-fail-under=80 | tee reports/pytest-aula24.log
          python src/scripts/gerar_relatorio_executivo.py
          python src/scripts/auditar_modelo_ml.py \
            --output-dir reports/model_audit --fail-on-alert
      - name: Anexar evidências da Aula 24
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-aula24-${{ github.run_number }}
          path: |
            reports/coverage.xml
            reports/coverage-html/
            reports/pytest-aula24.log
            data/output/relatorio_conferencia_lotes.xlsx
            data/output/resumo_executivo.md
            data/output/resumo_conferencia_lotes.pdf
            data/output/execucao_dashboard.log
            reports/model_audit/
          if-no-files-found: warn

  test-e2e:
    name: Testes E2E (pytest-playwright)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar dependencias e Chromium
        run: |
          pip install -r requirements-dev.txt -r api_ml/requirements.txt
          playwright install chromium --with-deps
      - name: Executar os oito testes E2E
        env:
          RUN_BROWSER_E2E: "1"
        run: >-
          pytest tests/e2e/ -v --tb=short
          --screenshot=only-on-failure
          --output=tests/e2e/screenshots/playwright-output
      - name: Salvar screenshots E2E
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-e2e-${{ github.run_number }}
          path: tests/e2e/screenshots/
          if-no-files-found: warn

  build-docker:
    name: Build e teste em container
    runs-on: ubuntu-latest
    needs: [test, test-e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Preparar diretorios persistidos
        shell: bash
        run: |
          mkdir -p screenshots data/datapool data/output logs reports
          chmod -R a+rwX screenshots data/datapool data/output logs reports
      - name: Validar Compose
        run: docker compose --profile avaliacao --profile ml config --quiet
      - name: Build de todos os servicos Compose
        run: docker compose build
      - name: Build da imagem
        run: docker compose --profile avaliacao build bot-conferencia
      - name: Executar fluxo ML em container
        env:
          MAESTRO_ENABLED: "false"
        run: >-
          docker compose --profile ml up --build --abort-on-container-exit
          --exit-code-from bot-classificador api-ml bot-classificador
      - name: Executar bot em container
        env:
          MAESTRO_ENABLED: "false"
          ENVIRONMENT: container
        run: docker compose run --rm bot-conferencia
      - name: Verificar evidencias geradas
        shell: bash
        run: |
          test -n "$(find logs -type f -print -quit)" || (echo "logs/ vazio" && exit 1)
          test -n "$(find data/output -type f -print -quit)" || (echo "data/output/ vazio" && exit 1)
          test -n "$(find screenshots -type f -name '*.png' -print -quit)" || (echo "screenshots/ vazio" && exit 1)
          grep -q '"event": "ML_DECISION"' data/output/execucao_dashboard.log
          docker compose run --rm --no-deps --entrypoint python \
            bot-conferencia src/scripts/verify_pipeline.py
      - name: Salvar evidencias como artefato
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-${{ github.run_number }}
          path: |
            logs/
            data/output/
            data/datapool/
            screenshots/
            reports/
          if-no-files-found: warn
      - name: Encerrar Compose
        if: always()
        run: docker compose --profile avaliacao down --volumes --remove-orphans

  seguranca:
    name: Verificacao de credenciais
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reprovar credenciais hardcoded
        shell: bash
        run: |
          if grep -RIn --include='*.py' \
            -E '(password|secret|api_key|token)[[:space:]]*=[[:space:]]*["'\''][^"'\'']+["'\'']' \
            bot.py coletor.py main.py pipeline.py producer.py consumer.py config.py src api_ml tests web; then
            echo "Credencial possivelmente hardcoded."
            exit 1
          fi
