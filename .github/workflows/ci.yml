name: CI — Pipeline de Lotes

on:
  push:
    branches: [main, develop, Developer, "feature/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop, Developer]

env:
  PYTHON_VERSION: "3.12"

jobs:
  qualidade:
    name: Lint e qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install flake8
      - name: Verificar erros Python
        run: >-
          flake8 bot.py main.py producer.py consumer.py config.py src/ scripts/
          tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Verificar estilo sem bloquear
        run: >-
          flake8 bot.py main.py producer.py consumer.py config.py src/ scripts/
          tests/ --count --max-line-length=100 --ignore=E501,W503
          --exit-zero --statistics

  testes:
    name: Testes Python
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Executar testes
        env:
          MAESTRO_ENABLED: "false"
        run: pytest tests/ -v --tb=short

  frontend:
    name: Build do frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend

  docker-e2e:
    name: Docker Compose E2E
    runs-on: ubuntu-latest
    needs: [testes, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validar Compose
        run: docker compose config --quiet
      - name: Executar produtor e consumidor
        run: docker compose up --build --exit-code-from consumer
      - name: Verificar artefatos persistidos
        run: python scripts/verify_pipeline.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-pipeline
          path: |
            artefatos/
            data/output/
            data/datapool/
            logs/
      - name: Encerrar Compose
        if: always()
        run: docker compose down --volumes

  seguranca:
    name: Verificação de credenciais
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reprovar credenciais hardcoded
        shell: bash
        run: |
          if grep -RIn --include='*.py' \
            -E '(password|secret|api_key|token)[[:space:]]*=[[:space:]]*["'\''][^"'\'']+["'\'']' \
            bot.py main.py producer.py consumer.py config.py src scripts; then
            echo "Credencial possivelmente hardcoded."
            exit 1
          fi
