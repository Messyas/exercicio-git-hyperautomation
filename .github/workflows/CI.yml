name: CI — AgendaFácil

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.11'
  IMAGE:         agendafacil

jobs:

  # ── JOB 1: Qualidade de código ───────────────────────────────────
  qualidade:
    name: 🔍 Lint e Qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: pip install flake8 black isort
      - name: flake8
        run: flake8 app/ tests/ --max-line-length=100 --ignore=E501,W503
      - name: black (verificar formatação)
        run: black --check app/ tests/
      - name: isort (verificar imports)
        run: isort --check-only app/ tests/

  # ── JOB 2: Testes em matriz ──────────────────────────────────────
  testes:
    name: 🧪 Testes Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: qualidade
    strategy:
      matrix:
        python-version: [ '3.10', '3.11', '3.12' ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Testes com cobertura
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-fail-under=80
      - name: Subir cobertura como artefato
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cov-${{ matrix.python-version }}
          path: coverage.xml

  # ── JOB 3: Segurança ─────────────────────────────────────────────
  seguranca:
    name: 🛡️ Análise de Segurança
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: pip install bandit safety
      - name: bandit (vulnerabilidades no código)
        run: bandit -r app/ -ll
      - name: safety (vulnerabilidades em dependências)
        run: safety check -r requirements.txt

  # ── JOB 4: Build Docker (só na main) ─────────────────────────────
  docker:
    name: 🐳 Build e Push Docker
    runs-on: ubuntu-latest
    needs: [ testes, seguranca ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - uses: docker/build-push-action@v5
        with:
          context:    .
          push:       true
          tags:       ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Testar imagem publicada
        run: |
          docker run -d --name test -p 5000:5000 \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE }}:latest
          sleep 10
          curl -sf http://localhost:5000/health || (docker logs test && exit 1)
          docker rm -f test