name: CI — Bot Inspeção de Lotes

on:
  push:
    branches: [ main, develop, 'feature/**', 'release/**', 'hotfix/**' ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'

jobs:

  # ── JOB 1: Qualidade de código ───────────────────────────────────
  qualidade:
    name: 🔍 Lint e Qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar ferramentas de lint
        run: pip install flake8

      - name: flake8 — erros de sintaxe e nomes indefinidos (bloqueia merge)
        run: flake8 bot.py main.py config.py src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: flake8 — avisos de estilo (não bloqueia)
        run: flake8 bot.py main.py config.py src/ tests/ --count --max-line-length=120 --ignore=E501,W503 --exit-zero --statistics

  # ── JOB 2: Testes ──────────────────────────────────────────────
  testes:
    name: 🧪 Testes Python
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar testes com cobertura
        env:
          MAESTRO_ENABLED: 'false'
        run: pytest tests/ -v --tb=short

  # ── JOB 3: Segurança ─────────────────────────────────────────────
  seguranca:
    name: 🛡️ Verificação de Segurança
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v4

      - name: Verificar ausência de credenciais no código
        run: |
          echo "Verificando credenciais hardcodadas..."
          ! grep -rn --include='*.py' -E '(password|secret|api_key|token)\s*=\s*["\x27][^"\x27]+["\x27]' \
            bot.py main.py config.py src/ || true
          echo "✅ Nenhuma credencial encontrada no código-fonte."