<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadastro de Lotes</title>
    <style>
      body { font-family: Arial, sans-serif; background: #f5f5f5; color: #202020; margin: 0; }
      main { background: #fff; border: 1px solid #ddd; margin: 2rem auto; max-width: 42rem; padding: 2rem; }
      form { display: grid; gap: 1rem; }
      label, legend { font-weight: 600; }
      input, select, textarea, button { box-sizing: border-box; font: inherit; padding: .5rem; width: 100%; }
      fieldset { border: 0; margin: 0; padding: 0; }
      .radios { display: flex; gap: 1rem; margin-top: .5rem; }
      .radios label { font-weight: normal; }
      .radios input { width: auto; }
      [role="status"] { background: #e7f8ed; border: 1px solid #298a4b; margin-bottom: 1rem; padding: .75rem; }
      [role="alert"] { color: #a22020; margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <section id="login">
        <h1>Acesso ao cadastro</h1>
        <form id="login-form">
          <label>Usuário <input name="usuario" required /></label>
          <label>Senha <input name="senha" type="password" required /></label>
          <button type="submit">Entrar</button>
        </form>
      </section>

      <section id="cadastro" hidden>
        <h1>Cadastro de Lotes</h1>
        <div id="sucesso" role="status" hidden></div>
        <form id="lote-form" aria-label="Formulário de cadastro de lote" novalidate>
          <label>Número do lote <input id="lote_id" /></label>
          <p id="lote-id-erro" role="alert" hidden>Informe o número do lote.</p>
          <label for="produto">Produto</label>
          <select id="produto">
            <option value="">Selecione um produto</option>
            <option>AC12-SPLIT</option><option>AC18-SPLIT</option>
            <option>AC9-WINDOW</option><option>MON24-FHD</option>
            <option>MON27-QHD</option><option>MON32-4K</option>
            <option>TV43-FHD</option><option>TV50-4K-B</option>
            <option>TV55-4K-B</option><option>TV65-OLED</option>
          </select>
          <p id="produto-erro" role="alert" hidden>Selecione um produto.</p>
          <label>Linha <input id="linha" /></label>
          <label>Turno <input id="turno" /></label>
          <fieldset>
            <legend>Status</legend>
            <div class="radios">
              <label><input type="radio" name="status" value="APROVADO" checked /> APROVADO</label>
              <label><input type="radio" name="status" value="REPROVADO" /> REPROVADO</label>
              <label><input type="radio" name="status" value="NOK" /> NOK</label>
              <label><input type="radio" name="status" value="PENDENTE" /> PENDENTE</label>
              <label><input type="radio" name="status" value="OK" /> OK</label>
              <label><input type="radio" name="status" value="REPROV." /> REPROV.</label>
              <label><input type="radio" name="status" value="APROVADO PARCIAL" /> APROVADO PARCIAL</label>
            </div>
          </fieldset>
          <label>Responsável <input id="responsavel" /></label>
          <label>Data <input id="data" placeholder="DD/MM/AAAA" /></label>
          <label>Observação <textarea id="observacao"></textarea></label>
          <button type="submit">Processar lote</button>
        </form>
      </section>
    </main>
    <script>
      const login = document.querySelector('#login');
      const cadastro = document.querySelector('#cadastro');
      document.querySelector('#login-form').addEventListener('submit', (event) => {
        event.preventDefault();
        login.hidden = true;
        cadastro.hidden = false;
      });

      document.querySelector('#lote-form').addEventListener('submit', (event) => {
        event.preventDefault();
        const loteId = document.querySelector('#lote_id');
        const produto = document.querySelector('#produto');
        const loteErro = document.querySelector('#lote-id-erro');
        const produtoErro = document.querySelector('#produto-erro');
        loteErro.hidden = Boolean(loteId.value.trim());
        produtoErro.hidden = Boolean(produto.value);
        if (!loteId.value.trim() || !produto.value) return;

        const lote = {
          lote_id: loteId.value.trim(), produto: produto.value,
          linha: document.querySelector('#linha').value.trim(),
          turno: document.querySelector('#turno').value.trim(),
          status: document.querySelector('input[name="status"]:checked').value,
          responsavel: document.querySelector('#responsavel').value.trim(),
          data: document.querySelector('#data').value.trim(),
          observacao: document.querySelector('#observacao').value.trim()
        };
        const registros = JSON.parse(localStorage.getItem('lotes-cadastrados') || '[]');
        registros.unshift(lote);
        localStorage.setItem('lotes-cadastrados', JSON.stringify(registros));
        const sucesso = document.querySelector('#sucesso');
        sucesso.textContent = `Lote ${lote.lote_id} processado com sucesso.`;
        sucesso.hidden = false;
      });
    </script>
  </body>
</html>
