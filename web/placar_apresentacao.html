<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Placar Público — S10-B</title>
<style>
body{font-family:system-ui;background:#111827;color:#f9fafb;margin:0;padding:32px}h1{margin-top:0}table{width:100%;border-collapse:collapse;background:#1f2937}th,td{padding:14px;border-bottom:1px solid #374151;text-align:left}.total{font-size:1.2rem;font-weight:700}.status{color:#93c5fd}small{color:#9ca3af}
</style>
<h1>Placar Público — S10-B</h1><p class="status" id="status">Carregando…</p>
<table><thead><tr><th>Grupo</th><th>Orquestração</th><th>Híbrido</th><th>Resiliência</th><th>Notificação</th><th>Total</th></tr></thead><tbody id="rows"></tbody></table>
<small>Atualização automática a cada 2 segundos. A avaliação final é responsabilidade da banca.</small>
<script>
async function refresh(){try{const data=await fetch('/reports/apresentacao/placar.json?'+Date.now()).then(r=>r.json());const groups=data.grupos||{};document.querySelector('#rows').innerHTML=Object.entries(groups).map(([name,v])=>{const e=v.eixos||{};return `<tr><td>${name}<br><small>${v.status||''}</small></td><td>${e.orquestracao||0}</td><td>${e.hibrido||0}</td><td>${e.resiliencia||0}</td><td>${e.notificacao||0}</td><td class="total">${v.total||0}</td></tr>`}).join('');document.querySelector('#status').textContent='Atualizado: '+new Date().toLocaleTimeString()}catch(e){document.querySelector('#status').textContent='Aguardando primeiro grupo…'}}refresh();setInterval(refresh,2000)
</script>
