services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      SHUTDOWN_FILE: /run-status/tests-finished
    volumes:
      - run-status:/run-status
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 15s

  tests:
    build:
      context: ./test
      dockerfile: Dockerfile
    depends_on:
      frontend:
        condition: service_healthy
    env_file:
      - path: ./test/.env.example
        required: true
      - path: ./test/.env
        required: false
    environment:
      SHUTDOWN_FILE: /run-status/tests-finished
    volumes:
      - ./test/evidencias:/app/evidencias
      - ./test/logs:/app/logs
      - run-status:/run-status
    shm_size: 2gb

volumes:
  run-status:
