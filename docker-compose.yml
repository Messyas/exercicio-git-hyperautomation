services:
  run-status-init:
    # Volumes nomeados são criados como root. Este init libera apenas o volume
    # de sinalização para o usuário não-root (UID 1000) dos bots.
    image: busybox:1.36.1
    user: "0:0"
    volumes:
      - run-status:/run-status
    command:
      - sh
      - -c
      - "mkdir -p /run-status && chown -R 1000:1000 /run-status && chmod -R u+rwX,g+rwX /run-status"
    restart: "no"

  api-ml:
    profiles: ["ml"]
    build:
      context: .
      dockerfile: api_ml/Dockerfile
    ports:
      - "8000:8000"
    environment:
      ML_MODEL_PATH: /service/models/classificador_lotes.pkl
      ML_MAX_CONCURRENCY: "1"
      TZ: America/Manaus
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: "no"

  producer:
    build:
      context: .
      dockerfile: Dockerfile
      target: producer
    depends_on:
      run-status-init:
        condition: service_completed_successfully
    env_file:
      - path: ./.env.example
        required: true
      - path: ./.env
        required: false
    environment:
      BOT_ID: bot-lotes-cadastro-playwright-mk7
      BOT_URL: file:///app/web/lote-teste.html
      BOT_HEADLESS: "true"
      BOT_LOG_DIR: /app/logs
      DATAPOOL_BACKEND: local
      DATAPOOL_LOCAL_DIR: /app/data/datapool
      PLAYWRIGHT_ARTIFACTS_DIR: /app/screenshots
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      ENVIRONMENT: container
      APP_TIMEZONE: America/Manaus
      TZ: America/Manaus
      ML_API_URL: http://api-ml:8000
    volumes:
      - ./screenshots:/app/screenshots
      - ./data/datapool:/app/data/datapool
      - ./logs:/app/logs
      - ./reports:/app/reports
      - run-status:/run-status
    shm_size: 1gb
    restart: "no"

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
      target: consumer
    depends_on:
      run-status-init:
        condition: service_completed_successfully
      producer:
        condition: service_completed_successfully
    env_file:
      - path: ./.env.example
        required: true
      - path: ./.env
        required: false
    environment:
      BOT_ID: bot-lotes-validacao-mk7
      BOT_LOG_DIR: /app/logs
      BOT_OUTPUT_DIR: /app/data/output
      DATAPOOL_BACKEND: local
      DATAPOOL_LOCAL_DIR: /app/data/datapool
      SHUTDOWN_FILE: /run-status/pipeline-finished
      ENVIRONMENT: container
      APP_TIMEZONE: America/Manaus
      TZ: America/Manaus
      ML_API_URL: http://api-ml:8000
    volumes:
      - ./data/datapool:/app/data/datapool
      - ./data/output:/app/data/output
      - ./logs:/app/logs
      - ./reports:/app/reports
      - run-status:/run-status
    restart: "no"

  bot-conferencia:
    profiles: ["avaliacao"]
    build:
      context: .
      dockerfile: Dockerfile
      target: producer
    depends_on:
      run-status-init:
        condition: service_completed_successfully
    env_file:
      - path: ./.env.example
        required: true
      - path: ./.env
        required: false
    environment:
      BOT_URL: file:///app/web/lote-teste.html
      BOT_HEADLESS: "true"
      BOT_LOG_DIR: /app/logs
      BOT_OUTPUT_DIR: /app/data/output
      DATAPOOL_BACKEND: local
      DATAPOOL_LOCAL_DIR: /app/data/datapool
      PLAYWRIGHT_ARTIFACTS_DIR: /app/screenshots
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      SHUTDOWN_FILE: /run-status/pipeline-finished
      ENVIRONMENT: container
      APP_TIMEZONE: America/Manaus
      TZ: America/Manaus
      ML_API_URL: http://api-ml:8000
    volumes:
      - ./screenshots:/app/screenshots
      - ./data/datapool:/app/data/datapool
      - ./data/output:/app/data/output
      - ./logs:/app/logs
      - ./reports:/app/reports
      - run-status:/run-status
    shm_size: 1gb
    restart: "no"
    command: ["python", "pipeline.py"]

  bot-classificador:
    profiles: ["ml"]
    build:
      context: .
      dockerfile: Dockerfile
      target: ml-runner
    depends_on:
      api-ml:
        condition: service_healthy
    env_file:
      - path: ./.env.example
        required: true
      - path: ./.env
        required: false
    environment:
      ML_API_URL: http://api-ml:8000
      APP_TIMEZONE: America/Manaus
      TZ: America/Manaus
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["python", "dashboard/main.py"]

volumes:
  run-status:
