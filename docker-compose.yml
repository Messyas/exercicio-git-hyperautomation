services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 20s

  playwright-bot:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      - BOT_URL=http://frontend:3000
      - BOT_HEADLESS=true
    volumes:
      - ./evidencias:/app/evidencias
