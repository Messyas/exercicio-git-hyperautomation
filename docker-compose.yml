services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      SHUTDOWN_FILE: /run-status/pipeline-finished
      TZ: America/Manaus
    volumes:
      - run-status:/run-status
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 15s

  producer:
    build:
      context: .
      dockerfile: Dockerfile
      target: producer
    depends_on:
      frontend:
        condition: service_healthy
    env_file:
      - path: ./.env.example
        required: true
      - path: ./.env
        required: false
    environment:
      BOT_ID: bot-lotes-cadastro-playwright-mk7
      BOT_URL: http://frontend:3000
      BOT_HEADLESS: "true"
      BOT_LOG_DIR: /app/logs
      DATAPOOL_BACKEND: local
      DATAPOOL_LOCAL_DIR: /app/data/datapool
      PLAYWRIGHT_ARTIFACTS_DIR: /app/screenshots
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      ENVIRONMENT: container
      APP_TIMEZONE: America/Manaus
      TZ: America/Manaus
    volumes:
      - ./dados_entrada:/app/dados_entrada:ro
      - ./screenshots:/app/screenshots
      - ./data/datapool:/app/data/datapool
      - ./logs:/app/logs
      - ./reports:/app/reports
      - run-status:/run-status
    shm_size: 1gb
    restart: "no"

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
      target: consumer
    depends_on:
      producer:
        condition: service_completed_successfully
    env_file:
      - path: ./.env.example
        required: true
      - path: ./.env
        required: false
    environment:
      BOT_ID: bot-lotes-validacao-mk7
      BOT_LOG_DIR: /app/logs
      BOT_OUTPUT_DIR: /app/data/output
      DATAPOOL_BACKEND: local
      DATAPOOL_LOCAL_DIR: /app/data/datapool
      SHUTDOWN_FILE: /run-status/pipeline-finished
      ENVIRONMENT: container
      APP_TIMEZONE: America/Manaus
      TZ: America/Manaus
    volumes:
      - ./data/datapool:/app/data/datapool
      - ./data/output:/app/data/output
      - ./logs:/app/logs
      - ./reports:/app/reports
      - run-status:/run-status
    restart: "no"

  bot-conferencia:
    profiles: ["avaliacao"]
    build:
      context: .
      dockerfile: Dockerfile
      target: producer
    depends_on:
      frontend:
        condition: service_healthy
    env_file:
      - path: ./.env.example
        required: true
      - path: ./.env
        required: false
    environment:
      BOT_URL: http://frontend:3000
      BOT_HEADLESS: "true"
      BOT_LOG_DIR: /app/logs
      BOT_OUTPUT_DIR: /app/data/output
      DATAPOOL_BACKEND: local
      DATAPOOL_LOCAL_DIR: /app/data/datapool
      PLAYWRIGHT_ARTIFACTS_DIR: /app/screenshots
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      SHUTDOWN_FILE: /run-status/pipeline-finished
      ENVIRONMENT: container
      APP_TIMEZONE: America/Manaus
      TZ: America/Manaus
    volumes:
      - ./dados_entrada:/app/dados_entrada:ro
      - ./screenshots:/app/screenshots
      - ./data/datapool:/app/data/datapool
      - ./data/output:/app/data/output
      - ./logs:/app/logs
      - ./reports:/app/reports
      - run-status:/run-status
    shm_size: 1gb
    restart: "no"
    command: ["python", "pipeline.py"]

volumes:
  run-status:
