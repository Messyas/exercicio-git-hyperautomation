services:
  api-ml:
    build:
      context: ..
      dockerfile: api_ml/Dockerfile
    environment:
      ML_MODEL_PATH: /service/models/classificador_lotes.pkl
      ML_MAX_CONCURRENCY: "1"
      TZ: America/Manaus
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  dashboard-lotes:
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    ports:
      - "8501:8501"
    environment:
      ML_API_URL: http://api-ml:8000
      APP_TIMEZONE: America/Manaus
      TZ: America/Manaus
    depends_on:
      api-ml:
        condition: service_healthy
    volumes:
      - ../data:/app/data
    command:
      - /bin/sh
      - -c
      - >-
        python -m dashboard.main
        && exec streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8501 --browser.gatherUsageStats=false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped
