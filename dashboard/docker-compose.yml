services:
  dashboard-lotes:
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ../data:/app/data
    command:
      - /bin/sh
      - -c
      - >-
        python -m dashboard.main
        && exec streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8501 --browser.gatherUsageStats=false
    restart: unless-stopped
