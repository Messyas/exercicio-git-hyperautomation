# Ambiente isolado e opt-in para o ensaio de carga/sabotagem do Exercício 24-A.
# A porta 8001 evita conflito com o Compose principal, e os limites protegem a
# máquina anfitriã durante a demonstração.
services:
  api-ml:
    build:
      context: .
      dockerfile: api_ml/Dockerfile
    ports:
      - "8001:8000"
    environment:
      ML_MODEL_PATH: /service/models/classificador_lotes.pkl
      ML_MAX_CONCURRENCY: "1"
      TZ: America/Manaus
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: "no"
