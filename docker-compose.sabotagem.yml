# Ambiente isolado e opt-in para o ensaio de carga/sabotagem do Exercício 24-A.
# A porta 8001 evita conflito com o Compose principal, e os limites protegem a
# máquina anfitriã durante a demonstração.
services:
  api-ml:
    build:
      context: .
      dockerfile: api_ml/Dockerfile
    ports:
      - "8000:8000"
    environment:
      ML_MODEL_PATH: /service/models/classificador_lotes.pkl
      ML_MAX_CONCURRENCY: "1"
      TZ: America/Manaus
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: "no"

  simulacao-crise:
    build:
      context: .
      dockerfile: Dockerfile
      target: producer
    depends_on:
      api-ml:
        condition: service_healthy
    env_file:
      - path: ./.env.example
        required: true
      - path: ./.env
        required: false
    environment:
      ML_API_URL: http://api-ml:8000
      APP_TIMEZONE: America/Manaus
      TZ: America/Manaus
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
    command: ["python", "scripts/simular_cenarios_sabotagem.py"]

