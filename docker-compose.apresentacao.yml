services:
  api-ml:
    build:
      context: .
      dockerfile: api_ml/Dockerfile
    environment:
      ML_MODEL_PATH: /service/models/classificador_lotes.pkl
      ML_MAX_CONCURRENCY: "1"
      TZ: America/Manaus
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  apresentacao:
    build:
      context: .
      dockerfile: Dockerfile
      target: producer
    depends_on:
      api-ml:
        condition: service_healthy
    env_file:
      - path: ./.env.example
        required: true
      - path: ./.env
        required: false
    environment:
      BOT_INPUT_FILE: /incidente/lote_incidente.xlsx
      ML_API_URL: http://api-ml:8000
      DATAPOOL_BACKEND: local
      DATAPOOL_LOCAL_DIR: /app/data/datapool
      BOT_URL: file:///app/web/lote-teste.html
      BOT_HEADLESS: "true"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PRESENTATION_START_DELAY_SECONDS: ${PRESENTATION_START_DELAY_SECONDS:-15}
      PRESENTATION_GROUP: ${PRESENTATION_GROUP:-messyas}
    volumes:
      - ./data/incident:/incidente:ro
      - ./data/datapool:/app/data/datapool
      - ./data/output:/app/data/output
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./screenshots:/app/screenshots
    command: ["python", "scripts/rodar_apresentacao.py"]

  placar:
    build:
      context: .
      dockerfile: Dockerfile
      target: consumer
    ports:
      - "8090:8090"
    volumes:
      - ./reports:/app/reports
    command: ["python", "-m", "http.server", "8090", "--directory", "/app"]
